  <text x="40" y="108" class="sans" font-size="16" font-weight="600" fill="#66ccdf">Support operations · deployed with Docker Compose</text>
  <text x="40" y="150" class="sans" font-size="16" fill="#a3aab8">Track incidents and hand off work between shifts.</text><text x="40" y="176" class="sans" font-size="16" fill="#a3aab8">Aladin helps operators search team runbooks</text><text x="40" y="202" class="sans" font-size="16" fill="#a3aab8">and draft reusable support workflows.</text>
