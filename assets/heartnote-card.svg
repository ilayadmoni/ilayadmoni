<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="HeartNote: Production full-stack app · live on AWS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1718"/><stop offset="1" stop-color="#241d1e"/></linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.1) } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none } }
    </style>
  </defs>
  <rect x="1" y="1" width="638" height="298" rx="20" fill="url(#bg)" stroke="#e0ad9c" stroke-opacity="0.35" stroke-width="1.5"/>
  <g transform="translate(560 76) scale(.9)">
    <path class="pulse" d="M0 -21 C -9 -39 -39 -36 -39 -12 C -39 9 -15 24 0 39 C 15 24 39 9 39 -12 C 39 -36 9 -39 0 -21 Z" fill="#2e2324" stroke="#d9a595" stroke-width="5"/>
  </g>
  <text x="40" y="78" class="sans" font-size="34" font-weight="800" fill="#ecebe8" letter-spacing="-0.8">HeartNote</text>
  <text x="40" y="108" class="sans" font-size="16" font-weight="600" fill="#e0ad9c">Production full-stack app · live on AWS</text>
  <text x="40" y="150" class="sans" font-size="16" fill="#a3aab8">Interactive, animated greeting cards in Hebrew, shared as</text><text x="40" y="176" class="sans" font-size="16" fill="#a3aab8">a link. Migrated from Supabase + Vercel to Terraform-</text><text x="40" y="202" class="sans" font-size="16" fill="#a3aab8">provisioned AWS with keyless OIDC + SSM deploys.</text>
  <g class="sans" font-size="13" font-weight="600"><g transform="translate(40 236)"><rect width="85" height="28" rx="14" fill="#3a2b2b"/><text x="42.5" y="19" text-anchor="middle" fill="#ecc3b5">Next.js</text></g><g transform="translate(133 236)"><rect width="110" height="28" rx="14" fill="#3a2b2b"/><text x="55.0" y="19" text-anchor="middle" fill="#ecc3b5">TypeScript</text></g><g transform="translate(251 236)"><rect width="110" height="28" rx="14" fill="#3a2b2b"/><text x="55.0" y="19" text-anchor="middle" fill="#ecc3b5">PostgreSQL</text></g><g transform="translate(369 236)"><rect width="52" height="28" rx="14" fill="#3a2b2b"/><text x="26.0" y="19" text-anchor="middle" fill="#ecc3b5">AWS</text></g><g transform="translate(429 236)"><rect width="101" height="28" rx="14" fill="#3a2b2b"/><text x="50.5" y="19" text-anchor="middle" fill="#ecc3b5">Terraform</text></g></g>
</svg>
